name: Deploy AfrisInc Web

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.GHCR_OWNER }}/afrisinc-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_NOTIFY_URL=${{ secrets.VITE_NOTIFY_URL }}
            VITE_NOTIFY_APP_ID=${{ secrets.VITE_NOTIFY_APP_ID }}
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
            VITE_GA_DEBUG=false

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/afrisinc-web"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            export GHCR_OWNER="${{ secrets.GHCR_OWNER }}"
            export IMAGE_TAG="latest"
            export VITE_API_URL="${{ secrets.VITE_API_URL }}"

            docker compose pull
            docker compose up -d
            docker image prune -af
